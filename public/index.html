    <!-- Global typography & Indic text rendering reset -->

      html,

      body {
        overflow: hidden;
      }

        display: flex;
        height: 100%;

      }
      /* Ensure proper complex text layout (CTL) and ligature shaping for Telugu & Indic scripts */

        font-family: 'Plus Jakarta Sans', 'Noto Sans Telugu', 'Kohinoor Telugu', 'Telugu Sangam MN', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Prevent Safari from dropping ligatures or rendering dotted circles on matras */
      body, div, span, p, h1, h2, h3, h4, h5, h6 {
        font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
